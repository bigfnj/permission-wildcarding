name: Tests

# Why this exists separately from "Release VSIX": that workflow runs the suite
# only on `release: published`, and only on ubuntu. Both halves of that cost
# this project a released defect. v1.4.1 was a one-fix patch for a lock-reclaim
# boundary that compared `Date.now() - stat.mtimeMs <= staleMs` -- mtimeMs
# carries sub-millisecond precision while Date.now() is whole milliseconds, so a
# just-written file could read as being from the future. Windows hid it because
# the intervening lock attempt burns more than a millisecond of file operations;
# Linux did not. It reached a published release because nothing ran the suite
# until release time, and 60 consecutive local runs of the broken code passed.
#
# So: run on every push and PR, and run on BOTH platforms. The suite has one
# POSIX-only skip, which is expected on windows-latest.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Never cancel the other platform on one failure: a platform-specific
      # failure is the single most useful signal this matrix produces, and
      # fail-fast would hide whether the other side agreed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No install step on purpose: this project has no runtime dependencies and
      # no devDependencies, so `npm ci` would fail for want of a lockfile. If a
      # dependency is ever added, this is the line that has to change.
      - name: Test
        run: npm test

      # The pack must stay closed under the Bash -> PowerShell mirroring rule.
      # `npm test` already asserts this, but running the reporter surfaces WHAT
      # drifted in the log rather than only that something did.
      - name: Starter pack mirror check
        run: node scripts/mirror-pack.js

  # A separate job, because it needs a shell the matrix above cannot give it.
  #
  # install.ps1 once replaced the user's whole settings.json with nothing but its
  # own hook entry: `ConvertFrom-Json -AsHashtable` is PowerShell 6+ only, so
  # under Windows PowerShell 5.1 it threw, the catch merely warned, and the write
  # went ahead. README names `.\install.ps1  # Windows PowerShell` with no version
  # requirement, so 5.1 is a supported shell.
  #
  # Nothing in the matrix job can catch that. GitHub's default shell on
  # windows-latest is `pwsh` (PowerShell 7), which is exactly the edition where
  # the parameter works and the bug does not exist — and both installers PARSE
  # clean under 5.1, so a syntax check sees nothing either. `shell: powershell` is
  # GitHub's alias for powershell.exe, i.e. Windows PowerShell 5.1.
  #
  # test/installers.test.js covers install.sh and uninstall.sh behaviourally on
  # every platform and guards the .ps1 pair statically. This is the behavioural
  # half of the .ps1 story.
  installers:
    name: installers on Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install.ps1 / uninstall.ps1 behaviour
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "expected Windows PowerShell 5.1; got $($PSVersionTable.PSVersion). This job is worthless under pwsh."
          }
          .\scripts\verify-installers.ps1
